<svg width="191" height="191" viewBox="0 0 191 191" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="haloGradient" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0" />
      <stop offset="80%" stop-color="#f5a623" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0.3" />
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer halo -->
  <circle cx="95.5" cy="95.5" r="90" fill="url(#haloGradient)" opacity="0.6">
    <animate attributeName="opacity" values="0.5;0.7;0.5" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Golden circle -->
  <circle cx="95.5" cy="95.5" r="80" fill="#f5a623" filter="url(#softGlow)"/>

  <!-- H left pillar -->
  <rect x="45" y="39" width="32" height="113" rx="4" ry="4" fill="#fff"/>
  <!-- H right pillar -->
  <rect x="114" y="39" width="32" height="113" rx="4" ry="4" fill="#fff"/>
  <!-- H crossbar -->
  <rect x="77" y="82" width="37" height="18" fill="#1a1a1a"/>

  <!-- Subtle edge highlight -->
  <circle cx="95.5" cy="95.5" r="80" stroke="white" stroke-width="1.2" fill="none" opacity="0.4">
    <animate attributeName="stroke-opacity" values="0.3;0.5;0.3" dur="5s" repeatCount="indefinite" />
  </circle>
</svg>